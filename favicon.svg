<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Empty tube outline -->
  <rect x="28" y="8" width="8" height="40" fill="none" stroke="#e8e3d3" stroke-width="3"/>

  <!-- Mercury column inside the tube, rising from bulb to mid-height -->
  <rect x="30" y="24" width="4" height="28" fill="#e8e3d3"/>

  <!-- Bulb at the base (solid, covers the tube end) -->
  <circle cx="32" cy="52" r="9" fill="#e8e3d3"/>

  <!-- Graduation ticks on the right side: alternating major / minor -->
  <rect x="40" y="14" width="6" height="2" fill="#e8e3d3"/>
  <rect x="40" y="22" width="4" height="2" fill="#e8e3d3"/>
  <rect x="40" y="30" width="6" height="2" fill="#e8e3d3"/>
  <rect x="40" y="38" width="4" height="2" fill="#e8e3d3"/>
</svg>
