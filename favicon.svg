<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="64" height="64" fill="#0a0a0a"/>

  <!-- Steam ribbons (3 lines, slightly offset for asymmetry) -->
  <path d="M20 6 Q23 12 20 18 Q17 24 20 26" stroke="#e8e3d3" stroke-width="2" fill="none" stroke-linecap="square"/>
  <path d="M32 4 Q35 11 32 18 Q29 24 32 26" stroke="#e8e3d3" stroke-width="2" fill="none" stroke-linecap="square"/>
  <path d="M44 6 Q47 12 44 18 Q41 24 44 26" stroke="#e8e3d3" stroke-width="2" fill="none" stroke-linecap="square"/>

  <!-- Mug body: brutalist square cup -->
  <rect x="12" y="28" width="32" height="28" fill="none" stroke="#e8e3d3" stroke-width="3"/>

  <!-- Tea surface line near top of mug -->
  <line x1="12" y1="34" x2="44" y2="34" stroke="#e8e3d3" stroke-width="2"/>

  <!-- Handle: square bracket -->
  <path d="M44 36 L54 36 L54 48 L44 48" fill="none" stroke="#e8e3d3" stroke-width="3" stroke-linejoin="miter"/>

  <!-- Bottom serif accent (brutalist base) -->
  <rect x="10" y="56" width="36" height="2" fill="#e8e3d3"/>
</svg>
