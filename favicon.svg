<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="64" height="64" fill="#0a0a0a"/>

  <!-- Bombilla mouthpiece: short horizontal cap on top of the straw -->
  <line x1="38" y1="6" x2="46" y2="6" stroke="#e8e3d3" stroke-width="3" stroke-linecap="square"/>

  <!-- Bombilla shaft: vertical metal straw, pierces the cup rim and stops inside -->
  <line x1="42" y1="6" x2="42" y2="42" stroke="#e8e3d3" stroke-width="3" stroke-linecap="square"/>

  <!-- Yerba leaves: short horizontal marks peeking above the cup rim -->
  <line x1="14" y1="28" x2="22" y2="28" stroke="#e8e3d3" stroke-width="2"/>
  <line x1="24" y1="26" x2="32" y2="26" stroke="#e8e3d3" stroke-width="2"/>
  <line x1="34" y1="28" x2="38" y2="28" stroke="#e8e3d3" stroke-width="2"/>

  <!-- Cup body: brutalist trapezoidal gourd (wider rim, narrower base) -->
  <polygon points="12,30 52,30 48,58 16,58" fill="none" stroke="#e8e3d3" stroke-width="3" stroke-linejoin="miter"/>

  <!-- Base serif accent (brutalist ground line) -->
  <rect x="10" y="60" width="44" height="2" fill="#e8e3d3"/>
</svg>
